name: deploy-main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required AWS values
        run: |
          for key in AWS_REGION AWS_ROLE_TO_ASSUME EC2_INSTANCE_ID; do
            if [ -z "${!key}" ]; then
              echo "Missing required value: $key"
              exit 1
            fi
          done

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify assumed role identity
        run: aws sts get-caller-identity

      - name: Check SSM managed instance status
        run: |
          set -euo pipefail
          PING_STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)

          echo "ping_status=$PING_STATUS"

          if [ "$PING_STATUS" != "Online" ]; then
            echo "SSM agent is not Online for instance: $EC2_INSTANCE_ID"
            exit 1
          fi

      - name: SSM smoke test
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "SSM smoke test from GitHub Actions" \
            --parameters commands='["echo SSM_OK","whoami","uname -a"]' \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID"

          for _ in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}'
                break
                ;;
              Failed|TimedOut|Cancelled|Undeliverable|Terminated)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}'
                exit 1
                ;;
              *)
                sleep 5
                ;;
            esac
          done

          if [ "$STATUS" != "Success" ]; then
            echo "SSM smoke test timed out"
            exit 1
          fi

      - name: Deploy to EC2 via SSM
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
          DEPLOY_BRANCH: main
        run: |
          set -euo pipefail

          cat >/tmp/deploy-main.sh <<EOF
          #!/usr/bin/env bash
          set -euo pipefail

          APP_DIR="/opt/app"
          REPO_URL="${REPO_URL}"
          DEPLOY_BRANCH="${DEPLOY_BRANCH}"
          APP_USER="ubuntu"

          sudo mkdir -p "\$APP_DIR"
          sudo chown -R "\$APP_USER:\$APP_USER" "\$APP_DIR"

          sudo -u "\$APP_USER" bash -lc "
            set -euo pipefail
            if [ ! -d \"\$APP_DIR/.git\" ]; then
              git -C \"\$APP_DIR\" init
            fi
            if git -C \"\$APP_DIR\" remote get-url origin >/dev/null 2>&1; then
              git -C \"\$APP_DIR\" remote set-url origin \"\$REPO_URL\"
            else
              git -C \"\$APP_DIR\" remote add origin \"\$REPO_URL\"
            fi
            git -C \"\$APP_DIR\" fetch --depth 1 origin \"\$DEPLOY_BRANCH\"
            git -C \"\$APP_DIR\" reset --hard FETCH_HEAD
            git -C \"\$APP_DIR\" clean -fd
            npm install --prefix \"\$APP_DIR\"
          "

          cat <<'SERVICE' | sudo tee /etc/systemd/system/app.service >/dev/null
          [Unit]
          Description=UMC 7th Project
          After=network.target

          [Service]
          Type=simple
          User=ubuntu
          WorkingDirectory=/opt/app
          ExecStart=/usr/bin/npm run dev --prefix /opt/app/
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          SERVICE

          sudo systemctl daemon-reload
          sudo systemctl enable app
          sudo systemctl restart app
          sudo systemctl is-active app
          EOF

          DEPLOY_B64=$(base64 -w 0 /tmp/deploy-main.sh)

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "Deploy main via SSM" \
            --parameters commands="[\"echo '$DEPLOY_B64' | base64 -d > /tmp/deploy-main.sh\",\"chmod +x /tmp/deploy-main.sh\",\"/tmp/deploy-main.sh\"]" \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID"

          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}'
                break
                ;;
              Failed|TimedOut|Cancelled|Undeliverable|Terminated)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}'
                exit 1
                ;;
              *)
                sleep 5
                ;;
            esac
          done

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment command timed out"
            exit 1
          fi
